# nginx site for the lead streamer: https://ai-sdr.grobots.ai -> 127.0.0.1:8090
#
# The scraper server already runs nginx (site scrapper.grobots.ai). This file only
# ADDS a site for one more name; it does not touch the existing one.
#
#   sudo cp nginx-lead-streamer.conf /etc/nginx/sites-available/ai-sdr.grobots.ai
#   sudo ln -s /etc/nginx/sites-available/ai-sdr.grobots.ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx        # reload, never restart
#   sudo certbot --nginx -d ai-sdr.grobots.ai --redirect
#
# It is plain HTTP on purpose: it is valid before a certificate exists, so
# `nginx -t` passes. certbot --nginx then adds `listen 443 ssl`, the certificate
# lines and the http->https redirect to this block by itself. The DNS A record
# for ai-sdr.grobots.ai must point at this server before certbot runs.

server {
    listen 80;
    server_name ai-sdr.grobots.ai;

    location / {
        proxy_pass http://127.0.0.1:8090;

        # The streamer refuses requests whose Host is not ai-sdr.grobots.ai (421),
        # so the original name must be passed on. $host never includes the port.
        proxy_set_header Host $host;
        # The real client address for the streamer's log (not a client-supplied list)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;          # a ping takes 1-2 s; this is the safety limit
        client_max_body_size 1k;          # the streamer never reads a request body

        # 300-lead responses are ~0.7-1 MB of JSON (1,000 leads: 2-3 MB); gzip cuts that by ~85%.
        gzip on;
        gzip_proxied any;
        gzip_types application/json;
        gzip_min_length 1024;
    }
}

# Alternative: hosting under a path prefix on an existing domain
# (set PUBLIC_BASE_URL=https://example.com/streamer):
